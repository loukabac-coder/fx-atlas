name: Sonde des sources (développement)
on:
  push:
    branches: [probe]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r robot/requirements.txt
      - run: python robot/probe.py
      - name: Enregistrer les réponses brutes
        run: |
          git config user.name "fx-atlas-robot"
          git config user.email "actions@users.noreply.github.com"
          git add -f probe_out
          git commit -m "Sonde : réponses brutes des sources [skip ci]" || echo "rien"
          git push
