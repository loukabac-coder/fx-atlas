<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FX Atlas — taux directeurs, inflation et devises</title>
<meta name="description" content="Globe des taux directeurs, de l'inflation et des devises des principales banques centrales. Données officielles mises à jour chaque jour.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><radialGradient id='g' cx='.35' cy='.35'><stop offset='0' stop-color='%23ffd27a'/><stop offset='.55' stop-color='%23f0715a'/><stop offset='1' stop-color='%237a2d6b'/></radialGradient></defs><circle cx='16' cy='16' r='14' fill='url(%23g)'/></svg>">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span>FX Atlas <small>banques centrales &amp; devises</small></div>
  <nav class="tabs" id="tabs">
    <button data-view="globe" class="on">Globe</button>
    <button data-view="calendar">Calendrier</button>
    <button data-view="fx">Devises</button>
    <button data-view="rank">Classement</button>
    <button data-view="method">Sources &amp; qualité</button>
  </nav>
  <div class="fresh" id="fresh"><span class="pill"><i></i>Chargement…</span></div>
</header>

<main>
  <section class="view on" id="view-globe">
    <div class="globe-layout">
      <div class="stage" id="stage">
        <div class="metric-bar" id="metricBar"></div>
        <div id="globe"></div>
        <div id="flat"></div>
        <div class="flat-tip tip" id="flatTip"></div>
        <div class="legend" id="legend"></div>
        <div class="stage-tools">
          <button id="btnSpin" class="on" title="Rotation automatique">Rotation</button>
          <button id="btnFlat" title="Basculer globe / carte plate">Carte plate</button>
        </div>
      </div>
      <aside class="panel" id="panel"></aside>
    </div>
  </section>

  <section class="view" id="view-calendar"></section>
  <section class="view" id="view-fx"></section>
  <section class="view" id="view-rank"></section>
  <section class="view" id="view-method"></section>
</main>

<script src="vendor/globe.gl.min.js"></script>
<script src="vendor/chart.umd.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
